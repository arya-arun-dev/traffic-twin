services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: traffictwin
      POSTGRES_USER: traffictwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - traffictwin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffictwin -d traffictwin"]
      interval: 5s
      timeout: 5s
      retries: 20

  simulation-service:
    build:
      context: .
      dockerfile: services/simulation-service/Dockerfile
    environment:
      PORT: 8081
      HOST: 0.0.0.0
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  spring-api:
    build:
      context: .
      dockerfile: backend/spring-api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/traffictwin
      SPRING_DATASOURCE_USERNAME: traffictwin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SIMULATION_SERVICE_URL: http://simulation-service:8081
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      simulation-service:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:?VITE_MAPTILER_API_KEY must be set}
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - spring-api

volumes:
  traffictwin-postgres:
